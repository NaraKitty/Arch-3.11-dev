# arch311 reference machine: real Windows for Workgroups 3.11 for pixel comparisons.
# Shared settings; each run adds an [autoexec] via a second -conf file.
[sdl]
fullscreen = false
output = surface
windowresolution = original
windowposition = 40,40
showmenu = false
showbasic = false
autolock = false
waitonerror = false
priority = normal,normal

[dosbox]
title = arch311-ref
machine = svga_s3
memsize = 32
captures = C:\Users\pikac\arch311-ref\capture
startbanner = false
fastbioslogo = true
disable graphical splash = true
dpi aware = true
quit warning = false
working directory option = noprompt

[render]
aspect = false
scaler = none
frameskip = 0
doublescan = true

[cpu]
core = dynamic
cputype = pentium
cycles = max

[mixer]
nosound = true

[speaker]
pcspeaker = false

[sblaster]
sbtype = none

[dos]
ver = 6.22
